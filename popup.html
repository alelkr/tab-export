<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Tab Export</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --accent: #10b981;
    --accent-dark: #059669;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --bg: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    width: 280px;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    margin: 0;
    padding: 14px;
    background: var(--bg);
    color: var(--text);
  }

  header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  header img {
    width: 24px;
    height: 24px;
  }

  h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 14px 0 6px;
  }

  .section-label:first-of-type {
    margin-top: 0;
  }

  button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 9px 10px;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 500;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
    color: #fff;
    background: var(--primary);
  }

  button:hover { background: var(--primary-dark); }
  button:active { transform: scale(0.98); }

  button.secondary {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }

  button.secondary:hover { background: #f9fafb; }

  button.success { background: var(--accent); }
  button.success:hover { background: var(--accent-dark); }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 10px 0;
  }

  #status {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
    min-height: 1.2em;
  }

  #importCsv { display: none; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="">
    <h1>Tab Export</h1>
  </header>

  <div class="section-label">Exportieren</div>
  <button id="all">📋 Alle Tabs kopieren (Markdown)</button>
  <button id="current" class="secondary">📋 Nur aktuelles Fenster kopieren</button>
  <button id="csv" class="secondary">⬇️ Als CSV exportieren</button>
  <button id="csvCurrent" class="secondary">⬇️ Nur aktuelles Fenster als CSV</button>

  <hr>

  <div class="section-label">Importieren</div>
  <button id="importCsvBtn" class="success">🗂️ CSV importieren &amp; Fenster öffnen</button>
  <input type="file" id="importCsv" accept=".csv,text/csv">

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
